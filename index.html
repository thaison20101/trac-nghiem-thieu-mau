<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Trắc nghiệm Thiếu máu</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; font-family: "Segoe UI", Arial, sans-serif; background: #f2f5f9; color: #222; }
  header { position: sticky; top: 0; z-index: 10; background: #1a4d8f; color: #fff; padding: 10px 16px;
           display: flex; flex-wrap: wrap; gap: 10px; align-items: center; justify-content: space-between; }
  header h1 { font-size: 17px; margin: 0; }
  .bar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  select, button { font-size: 14px; padding: 6px 10px; border-radius: 6px; border: none; cursor: pointer; }
  button.primary { background: #ffb300; color: #222; font-weight: bold; }
  button.ghost { background: #fff; color: #1a4d8f; }
  #progress { font-size: 14px; }
  main { max-width: 860px; margin: 16px auto; padding: 0 12px 80px; }
  h2 { color: #1a4d8f; font-size: 17px; border-bottom: 2px solid #1a4d8f; padding-bottom: 4px; margin-top: 28px; }
  .q { background: #fff; border-radius: 10px; padding: 12px 14px; margin: 10px 0; box-shadow: 0 1px 3px rgba(0,0,0,.08);
       border-left: 5px solid transparent; }
  .q.correct { border-left-color: #2e7d32; }
  .q.wrong { border-left-color: #c62828; }
  .q.skipped { border-left-color: #f9a825; }
  .stem { font-weight: 600; margin-bottom: 8px; line-height: 1.4; }
  label { display: block; padding: 7px 10px; margin: 4px 0; border-radius: 6px; border: 1px solid #dde3ea; cursor: pointer; line-height: 1.35; }
  label:hover { background: #f4f8ff; }
  label input { margin-right: 8px; }
  label.right { background: #e8f5e9; border-color: #2e7d32; }
  label.picked-wrong { background: #ffebee; border-color: #c62828; }
  .verdict { margin-top: 6px; font-weight: bold; font-size: 14px; }
  .verdict.ok { color: #2e7d32; } .verdict.no { color: #c62828; } .verdict.skip { color: #b07800; }
  #result { background: #fff; border-radius: 10px; padding: 16px; margin: 16px 0; box-shadow: 0 1px 3px rgba(0,0,0,.1); display: none; }
  #result .score { font-size: 26px; font-weight: bold; color: #1a4d8f; }
  #result a { color: #c62828; margin-right: 6px; text-decoration: none; display: inline-block; }
  .hidden { display: none; }
</style>
</head>
<body>
<header>
  <h1>CÂU HỎI TRẮC NGHIỆM ÔN TẬP – BÀI 8: THIẾU MÁU (265 câu, đáp án ở cuối mỗi câu)</h1>
  <div class="bar">
    <select id="section"></select>
    <label style="border:none;padding:0;margin:0;color:#fff;display:flex;align-items:center;cursor:pointer">
      <input type="checkbox" id="shuffle"> Đảo thứ tự câu
    </label>
    <span id="progress"></span>
    <button class="primary" id="submit">Hoàn thành</button>
    <button class="ghost" id="reset">Làm lại</button>
  </div>
</header>
<main>
  <div id="result"></div>
  <div id="quiz"></div>
</main>
<script>
const SECTIONS = [{"name": "PHẦN 1. MỤC TIÊU VÀ MỞ ĐẦU (Câu 1 – 12)", "questions": [{"n": 1, "q": "Theo WHO, khoảng bao nhiêu phần trăm dân số trên toàn cầu bị thiếu máu?", "o": ["40%", "42%", "25%", "10%"], "a": 2}, {"n": 2, "q": "Theo WHO, tỷ lệ thiếu máu ở trẻ em dưới 5 tuổi khoảng:", "o": ["25%", "42%", "40%", "30%"], "a": 1}, {"n": 3, "q": "Theo WHO, tỷ lệ thiếu máu ở phụ nữ có thai khoảng:", "o": ["40%", "42%", "25%", "15%"], "a": 0}, {"n": 4, "q": "Thiếu máu nói một cách tổng quát là:", "o": ["Tình trạng giảm bạch cầu làm giảm miễn dịch", "Tình trạng giảm tiểu cầu dẫn đến xuất huyết", "Tình trạng tăng số lượng hồng cầu nhưng giảm chất lượng", "Tình trạng giảm về số lượng và/hoặc chất lượng hồng cầu dẫn đến giảm khả năng vận chuyển oxy của máu so với nhu cầu sinh lý của cơ thể"], "a": 3}, {"n": 5, "q": "Nhu cầu vận chuyển oxy của cơ thể thay đổi theo các yếu tố sau, NGOẠI TRỪ:", "o": ["Tình trạng hút thuốc lá và tình trạng mang thai", "Nhóm máu ABO", "Độ cao của khu vực sinh sống so với mực nước biển", "Tuổi, giới tính"], "a": 1}, {"n": 6, "q": "Thiếu máu nhẹ thường có đặc điểm:", "o": ["Luôn gây suy tim", "Thường không có triệu chứng và được phát hiện tình cờ khi kiểm tra sức khỏe hoặc xét nghiệm khi bị bệnh khác", "Luôn có triệu chứng rầm rộ", "Chỉ gặp ở người già"], "a": 1}, {"n": 7, "q": "Thiếu máu làm tăng nguy cơ tử vong, đặc biệt ở nhóm đối tượng nào?", "o": ["Vận động viên", "Trẻ nhũ nhi (< 1 tuổi) và người già", "Thanh thiếu niên và người trưởng thành", "Nam giới trưởng thành"], "a": 1}, {"n": 8, "q": "Ở các nước có nguồn lực hạn chế, nguyên nhân thiếu máu thường gặp là:", "o": ["Ung thư hệ tạo máu", "Bệnh tự miễn", "Thalassemia", "Dinh dưỡng kém và thiếu vi chất"], "a": 3}, {"n": 9, "q": "Nguyên nhân thiếu máu phổ biến nhất là:", "o": ["Thiếu acid folic", "Thiếu vitamin B12", "Thiếu sắt", "Thalassemia"], "a": 2}, {"n": 10, "q": "Ở các vùng địa lý hay chủng tộc đặc biệt, có thể gặp thiếu máu do khiếm khuyết về gen di truyền, ví dụ:", "o": ["Suy thận", "Thiếu sắt", "Thalassemia", "Thiếu folic"], "a": 2}, {"n": 11, "q": "Bài học tập trung vào các loại thiếu máu thường gặp nhất là:", "o": ["Thiếu máu do mất máu cấp và mạn", "Thiếu máu tan huyết, thiếu máu bất sản, thalassemia", "Thiếu máu do thiếu sắt, thiếu vitamin B12 và thiếu acid folic", "Thiếu máu do suy thận, ung thư, bệnh mạn tính"], "a": 2}, {"n": 12, "q": "Để đạt hiệu quả và an toàn trong điều trị thiếu máu cần phối hợp đồng bộ giữa:", "o": ["Điều dưỡng và kỹ thuật viên xét nghiệm", "Bác sĩ, dược sĩ và điều dưỡng", "Bác sĩ và bệnh nhân", "Dược sĩ và người nhà"], "a": 1}]}, {"name": "PHẦN 2. ĐỊNH NGHĨA (Câu 13 – 30)", "questions": [{"n": 13, "q": "Thiếu máu là tình trạng giảm lượng huyết sắc tố (Hb) trong máu ngoại vi dẫn đến:", "o": ["Tăng khả năng cung cấp oxy cho mô", "Giảm thể tích huyết tương", "Giảm khả năng cung cấp oxy cho các mô/tế bào của cơ thể", "Tăng độ nhớt máu"], "a": 2}, {"n": 14, "q": "Một người được coi là thiếu máu khi nồng độ huyết sắc tố trong máu thấp hơn so với:", "o": ["Lần xét nghiệm trước của chính người đó", "Giá trị trung bình của toàn dân số", "Người bệnh cùng tuổi", "Người khỏe mạnh cùng giới, cùng lứa tuổi và cùng môi trường sống"], "a": 3}, {"n": 15, "q": "Theo WHO, nam giới trưởng thành được xác định thiếu máu khi:", "o": ["Hb < 14 g/dL", "Hb < 13 g/dL", "Hb < 12 g/dL", "Hb < 11 g/dL"], "a": 1}, {"n": 16, "q": "Theo WHO, nữ giới trưởng thành, không mang thai được xác định thiếu máu khi:", "o": ["Hb < 11 g/dL", "Hb < 12 g/dL", "Hb < 13 g/dL", "Hb < 10 g/dL"], "a": 1}, {"n": 17, "q": "Giá trị ngưỡng Hb mà dưới mức đó được xác định là thiếu máu được gọi là:", "o": ["Cut-off value (giá trị ngưỡng)", "Giá trị trung bình", "Giá trị tối đa", "Giá trị tham chiếu tuyệt đối"], "a": 0}, {"n": 18, "q": "Theo một định nghĩa khác, thiếu máu là sự giảm một hay nhiều thông số của dòng hồng cầu, gồm:", "o": ["Hb, bạch cầu, tiểu cầu", "Ferritin, sắt huyết thanh, TIBC", "MCV, MCH, MCHC", "Hb, Hct, số lượng hồng cầu (RBC)"], "a": 3}, {"n": 19, "q": "Các thông số dòng hồng cầu được lấy từ xét nghiệm:", "o": ["Coombs", "Tủy đồ", "Phết máu ngoại vi", "Công thức máu (CBC)"], "a": 3}, {"n": 20, "q": "Nồng độ Hb thường được biểu diễn dưới dạng:", "o": ["Phần trăm (%)", "Gam trong 100 mL (g/dL) hoặc trong 1.000 mL (g/L)", "mg/L", "Số tế bào/mm³"], "a": 1}, {"n": 21, "q": "Hematocrit (Hct) được biểu diễn dưới dạng:", "o": ["fL", "Phần trăm (%)", "g/dL", "pg"], "a": 1}, {"n": 22, "q": "Hematocrit là:", "o": ["Số lượng hồng cầu trong 1 mm³ máu", "Tỷ lệ phần trăm của thể tích hồng cầu so với thể tích máu toàn phần", "Lượng Hb trong 1 hồng cầu", "Thể tích trung bình 1 hồng cầu"], "a": 1}, {"n": 23, "q": "Số lượng hồng cầu (RBC) được biểu diễn theo:", "o": ["Số lượng tế bào hồng cầu trong 1 mm³ máu toàn phần (hoặc trong 1 L máu toàn phần)", "Gam/dL", "pg/tế bào", "Phần trăm"], "a": 0}, {"n": 24, "q": "Nồng độ Hb phản ánh:", "o": ["Kích thước hồng cầu", "Khả năng vận chuyển oxy của máu", "Dự trữ sắt", "Khả năng gắn sắt"], "a": 1}, {"n": 25, "q": "Trong thực hành lâm sàng, thiếu máu thường được xác định dựa trên:", "o": ["MCV", "Ferritin", "Hb và/hoặc Hct", "Hồng cầu lưới"], "a": 2}, {"n": 26, "q": "Các giá trị ngưỡng xác định thiếu máu thay đổi theo các yếu tố sau, NGOẠI TRỪ:", "o": ["Nhóm máu Rh", "Chủng tộc, tuổi, giới", "Độ cao nơi sinh sống so với mực nước biển", "Tình trạng hút thuốc lá, mức độ vận động và tình trạng mang thai"], "a": 0}, {"n": 27, "q": "Theo Bảng 8.1 (WHO 2008), ngưỡng Hb xác định thiếu máu ở trẻ em 0,5 – < 5 tuổi là:", "o": ["12,0 g/dL", "11,5 g/dL", "13,0 g/dL", "11,0 g/dL"], "a": 3}, {"n": 28, "q": "Theo Bảng 8.1, ngưỡng Hb xác định thiếu máu ở trẻ em 5 – < 12 tuổi là:", "o": ["12,0 g/dL", "11,0 g/dL", "11,5 g/dL", "10,0 g/dL"], "a": 2}, {"n": 29, "q": "Theo Bảng 8.1, ngưỡng Hb xác định thiếu máu ở thanh thiếu niên (12 – < 15 tuổi) và phụ nữ không mang thai (≥ 15 tuổi) là:", "o": ["11,0 g/dL", "11,5 g/dL", "13,0 g/dL", "12,0 g/dL"], "a": 3}, {"n": 30, "q": "Theo Bảng 8.1, ngưỡng Hb xác định th c chiều với MCV", "Không liên quan MCV"], "a": 1}, {"n": 174, "q": "Không thể kết luận hồng cầu nhỏ hay nhược sắc nếu chỉ dựa trên một mình giá trị MCH vì:", "o": ["Hồng cầu nhỏ chứa ít Hb hơn hồng cầu bình thường do giảm thể tích, trong khi hồng cầu nhược sắc có nồng độ Hb thấp – cả hai đều làm giảm MCH", "MCH chỉ phản ánh dự trữ sắt", "MCH không đo được", "MCH luôn bình thường"], "a": 0}, {"n": 175, "q": "MCHC biểu thị chính xác màu sắc hồng cầu hơn MCH vì:", "o": ["MCHC phụ thuộc vào thể tích huyết tương", "MCHC phụ thuộc vào số lượng hồng cầu", "MCHC biểu thị nồng độ Hb theo một đơn vị thể tích hồng cầu, không phụ thuộc vào kích thước hồng cầu", "MCHC đo trực tiếp sắt"], "a": 2}, {"n": 176, "q": "Hồng cầu lưới (Retic) dùng để xác định:", "o": ["Kháng thể kháng hồng cầu", "Mức độ tan máu nội mạch", "Thiếu máu có khả năng hồi phục (tủy xương sản xuất hồng cầu bình thường) hay không hồi phục (tủy xương không còn khả năng sản xuất hồng cầu)", "Dự trữ sắt"], "a": 2}, {"n": 177, "q": "Thông thường, hồng cầu lưới chiếm khoảng bao nhiêu trong máu ngoại vi?", "o": ["15%", "5%", "1%", "10%"], "a": 2}, {"n": 178, "q": "Hồng cầu lưới giảm (hoặc không tăng) ở bệnh nhân thiếu máu cho thấy:", "o": ["Tủy xương đáp ứng tốt", "Đang tan huyết", "Khả năng tạo máu giảm (có thể do suy giảm hoạt động của tủy xương hay thiếu các yếu tố/nguyên liệu tạo máu: thiếu sắt, thiếu B12 hay acid folic, dinh dưỡng kém, suy thận, bệnh mạn tính)", "Đang mất máu cấp"], "a": 2}, {"n": 179, "q": "RDW (Red cell Distribution Width) biểu thị:", "o": ["Nồng độ Hb trong hồng cầu", "Mức bão hòa transferrin", "Độ đồng đều về kích thước của các hồng cầu, giá trị tham chiếu là 12 – 15%", "Tỷ lệ hồng cầu lưới"], "a": 2}, {"n": 180, "q": "Ở bệnh nhân thiếu máu hồng cầu nhỏ (MCV < 80 fL), RDW giúp phân biệt:", "o": ["Suy thận với bệnh mạn tính", "Thiếu sắt (RDW > 15%) với thalassemia (RDW bình thường do hồng cầu nhỏ đồng đều)", "Tan huyết với mất máu", "Thiếu B12 với thiếu folic"], "a": 1}, {"n": 181, "q": "Sắt h h nhân có tình trạng viêm mạn tính (viêm đa khớp dạng thấp, lao, lupus...)", "Tỷ lệ nghịch với lượng sắt dự trữ", "Luôn giảm trong mọi bệnh mạn tính"], "a": 1}, {"n": 190, "q": "Phát biểu nào đúng khi so sánh ferritin và sắt huyết thanh trong thiếu máu do bệnh mạn tính?", "o": ["Cả hai không thay đổi", "Cả hai đều tăng", "Ferritin luôn giảm, sắt huyết thanh luôn tăng", "Sắt huyết thanh có thể giảm cả trong thiếu máu do thiếu sắt và thiếu máu do bệnh mạn tính; ferritin có thể bình thường/tăng trong viêm mạn"], "a": 3}, {"n": 191, "q": "Nồng độ acid folic huyết thanh cho biết thiếu máu hồng cầu to do thiếu acid folic khi:", "o": ["< 4 ng/mL hay < 9 nmol/L", "< 200 pg/mL hay < 148 pmol/L", "< 15%", "< 12 g/dL"], "a": 0}, {"n": 192, "q": "Khi nồng độ acid folic huyết thanh bình thường ở bệnh nhân nghi ngờ thiếu folic, cần làm thêm xét nghiệm gì? Vì sao?", "o": ["Đo nồng độ acid folic trong hồng cầu, vì nồng độ acid folic huyết thanh dễ bị thay đổi bởi chế độ ăn", "Ferritin, vì phản ánh dự trữ folic", "Schilling test, vì đây là tiêu chuẩn vàng", "Coombs, vì phát hiện kháng thể"], "a": 0}, {"n": 193, "q": "Nồng độ vitamin B12 cho biết thiếu B12 khi giảm:", "o": ["< 4 ng/mL", "< 9 nmol/L", "< 200 pg/mL hay < 148 pmol/L", "< 1.000 mcg"], "a": 2}, {"n": 194, "q": "Phát biểu nào đúng về xét nghiệm vitamin B12?", "o": ["B12 huyết thanh không bao giờ giảm", "Thiếu B12 luôn được phát hiện sớm qua nồng độ huyết thanh", "Tình trạng thiếu B12 có thể đã xảy ra trước khi giảm nồng độ trong huyết thanh (do được lấy từ các mô dự trữ B12); thiếu B12 và folic hay chồng lắp nên cần đo cả hai", "Chỉ cần đo B12, không cần đo folic"], "a": 2}, {"n": 195, "q": "Schilling test được xem là \"tiêu chuẩn vàng\" để:", "o": ["Chẩn đoán thiếu sắt", "Chẩn đoán tan huyết tự miễn", "Đánh giá sự hấp thu vitamin B12; hiện nay ít được chỉ định do tính phức tạp và giá thành cao", "Đánh giá dự trữ folic"], "a": 2}, {"n": 196, "q": "Thay cho Schilling test, có thể dùng các xét nghiệm:", "o": ["Homocystein và const LETTERS = "ABCD";
let submitted = false;

const sel = document.getElementById("section");
sel.innerHTML = '<option value="all">Tất cả các phần</option>' +
  SECTIONS.map((s, i) => `<option value="${i}">${s.name}</option>`).join("");

function esc(s) { return s.replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])); }
function fmt(s) { return esc(s).replace(/\*\*(.+?)\*\*/g, "<b>$1</b>"); }

function render() {
  submitted = false;
  document.getElementById("result").style.display = "none";
  const chosen = sel.value === "all" ? SECTIONS.map((_, i) => i) : [Number(sel.value)];
  const shuffle = document.getElementById("shuffle").checked;
  let html = "";
  for (const si of chosen) {
    let qs = SECTIONS[si].questions.slice();
    if (shuffle) qs.sort(() => Math.random() - 0.5);
    html += `<h2>${esc(SECTIONS[si].name)}</h2>`;
    for (const q of qs) {
      html += `<div class="q" id="q${q.n}" data-a="${q.a}"><div class="stem">Câu ${q.n}. ${fmt(q.q)}</div>` +
        q.o.map((o, k) => `<label><input type="radio" name="r${q.n}" value="${k}">${LETTERS[k]}. ${fmt(o)}</label>`).join("") +
        `<div class="verdict"></div></div>`;
    }
  }
  document.getElementById("quiz").innerHTML = html;
  updateProgress();
  window.scrollTo(0, 0);
}

function updateProgress() {
  const total = document.querySelectorAll(".q").length;
  const done = document.querySelectorAll(".q input:checked").length;
  document.getElementById("progress").textContent = `Đã làm: ${done}/${total}`;
}

function submit() {
  const qs = document.querySelectorAll(".q");
  const unanswered = [...qs].filter(q => !q.querySelector("input:checked")).length;
  if (unanswered && !confirm(`Bạn còn ${unanswered} câu chưa làm. Vẫn nộp bài?`)) return;
  submitted = true;
  let right = 0; const wrongLinks = [];
  qs.forEach(q => {
    const a = Number(q.dataset.a);
    const picked = q.querySelector("input:checked");
    const labels = q.querySelectorAll("label");
    const v = q.querySelector(".verdict");
    labels.forEach(l => l.classList.remove("right", "picked-wrong"));
    q.classList.remove("correct", "wrong", "skipped");
    labels[a].classList.add("right");
    const n = q.id.slice(1);
    if (!picked) {
      q.classList.add("skipped"); v.className = "verdict skip";
      v.textContent = `⚠ Chưa làm – Đáp án đúng: ${LETTERS[a]}`;
      wrongLinks.push(n);
    } else if (Number(picked.value) === a) {
      right++; q.classList.add("correct"); v.className = "verdict ok"; v.textContent = "✔ Đúng";
    } else {
      labels[Number(picked.value)].classList.add("picked-wrong");
      q.classList.add("wrong"); v.className = "verdict no";
      v.textContent = `✘ Sai – Bạn chọn ${LETTERS[picked.value]}, đáp án đúng: ${LETTERS[a]}`;
      wrongLinks.push(n);
    }
    q.querySelectorAll("input").forEach(i => i.disabled = true);
  });
  const total = qs.length;
  const r = document.getElementById("result");
  r.style.display = "block";
  r.innerHTML = `<div class="score">Kết quả: ${right}/${total} câu đúng (${(right * 100 / total).toFixed(1)}%)</div>` +
    `<p>Điểm hệ 10: <b>${(right * 10 / total).toFixed(2)}</b> · Sai/chưa làm: <b>${total - right}</b> câu</p>` +
    (wrongLinks.length ? `<p>Bấm để xem lại câu sai/chưa làm:<br>${wrongLinks.map(n => `<a href="#q${n}">Câu ${n}</a>`).join(" ")}</p>` : "<p>Xuất sắc! Bạn đúng hết.</p>");
  window.scrollTo(0, 0);
}

document.getElementById("quiz").addEventListener("change", updateProgress);
document.getElementById("submit").onclick = submit;
document.getElementById("reset").onclick = () => { if (!submitted || confirm("Làm lại từ đầu?")) render(); };
sel.onchange = render;
document.getElementById("shuffle").onchange = render;
render();
</script>
</body>
</html>
